[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-lab"
version = "1.0.0"
description = "Sistema determinístico de videos para redes"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10",
  "fonttools>=4.50",
  "opencv-python-headless>=4.10",
  "faster-whisper>=1.0",
  "playwright>=1.49",
]

[tool.setuptools.packages.find]
include = ["video_lab*"]
